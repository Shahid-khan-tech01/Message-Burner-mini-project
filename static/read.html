<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />    
    <meta name="viewport" content="width=device-width, initial-scale=1" />  
    <meta name="referrer" content="no-referrer" />  
    <title>Reveal Message | Vanish X</title>  
    <link rel="stylesheet" href="/static/style.css" />  
    <script src="/static/app.js" defer></script>
  </head>   
  <body>
    <main>
      <!-- Professional logo and theme -->
      <header>
        <a href="/" class="brand-logo">
          <svg class="logo-icon" viewBox="0 0 64 64" aria-hidden="true">
            <defs>
              <linearGradient
                id="fireGradient"
                x1="0%"
                y1="0%"
                x2="100%"
                y2="100%"
              >
                <stop offset="0%" stop-color="#ffb347" />   
                <stop offset="100%" stop-color="#f43f5e" />
              </linearGradient>
            </defs> 
            <rect
              x="1"
              y="1"
              width="62"
              height="62"
              rx="17"
              fill="rgba(255,120,70,0.12)"
            />  
            <path
              d="M33 7 C36 22 49 24 49 39
                             C49 50 41 56 31 56
                             C19 56 12 48 15 37
                             C17 29 24 25 24 17
                             C29 20 30 26 30 29
                             C37 22 34 15 33 7Z"
              fill="url(#fireGradient)"
            />  
            <rect x="21" y="32" width="24" height="15" rx="4" fill="#fff5e8" /> 
            <path
              d="M24 35 L33 41 L42 35"
              stroke="#e85c39"
              stroke-width="2"
              stroke-linecap="round"
              fill="none"
            />
          </svg>    
          <div class="brand-text">
            <span class="brand-name"> Vanish X </span>

            <span class="brand-tagline"> Share. Reveal. Disappear. </span>
          </div>
        </a>    
        <button
          type="button"
          id="themeToggle"
          class="theme-toggle"
          onclick="toggleTheme()"
        >
          <span id="themeIcon">☀</span>    
          <span id="themeText">Light Mode</span>
        </button>
      </header> 
      <!-- Main heading -->
      <section class="hero">
        <span class="eyebrow"> PRIVATE DELIVERY </span> 
        <h1>
          A message<br />
          <em>just for you.</em>
        </h1>   
        <p>
          This message has limited access. Revealing it will use one permitted
          view.
        </p>
      </section>    
      <!-- Reveal button -->
      <button class="primary" id="reveal">Reveal Message / Image</button>   
      <!-- Status message -->
      <p id="status" role="status"></p> 
      <!-- Revealed content -->
      <section id="content" hidden>
        <h2>Your private message</h2>   
        <p id="message" class="message"></p>    
        <img id="photo" hidden alt="Shared image" />    
        <button class="remove" id="close">Close and Hide Content</button>
      </section>    
      <!-- Footer -->
      <footer>
        <a href="/"> Create Your Own Message → </a>
      </footer>
    </main> 
    <script>
      const $ = (id) => document.getElementById(id);    
      // Reveal message and image
      $("reveal").onclick = async function () {
        $("reveal").disabled = true;    
        $("status").textContent = "Opening your message...";    
        try {
          const token = location.pathname.split("/").pop(); 
          const response = await fetch("/message/" + token, {
            method: "POST",
            cache: "no-store",
          });   
          const data = await response.json();   
          if (!response.ok) {
            throw Error(data.detail);
          } 
          // Display text message
          $("message").textContent = data.message;  
          $("message").hidden = !data.message;  
          // Display image
          if (data.image) {
            $("photo").src = data.image;    
            $("photo").hidden = false;
          } 
          $("content").hidden = false;  
          $("reveal").hidden = true;    
          $("status").textContent = "Remaining views: " + data.remaining_reads;
        } catch (error) {
          $("status").textContent = error.message;
        }
      };    
      // Close revealed content
      $("close").onclick = function () {
        $("photo").removeAttribute("src");  
        $("message").textContent = "";
        $("content").hidden = true; 
        $("status").textContent = "Content has been hidden.";
      };
    </script>
  </body>
</html>
