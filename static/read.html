
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Open Secret Message</title>

    <link rel="stylesheet" href="/static/style.css">

</head>

<body>

<main class="container">

    <div class="topbar">

        <div class="tag">
            ONE-TIME MESSAGE
        </div>

        <button
            class="theme-toggle"
            id="themeToggle"
            onclick="toggleTheme()">

            ☀️ Light

        </button>

    </div>

    <h1>Your <span>message.</span></h1>

    <p class="intro">
        This message will be deleted as soon as it is displayed.
    </p>

    <div id="message" class="message">
        Opening message...
    </div>

    <p class="note">
        This link can only be opened once.
    </p>

</main>


<script>

// Apply saved theme
function applySavedTheme() {

    const theme =
        localStorage.getItem("messageBurnerTheme") || "dark";

    document.body.classList.toggle(
        "light-theme",
        theme === "light"
    );

    updateThemeButton();

}


// Switch theme
function toggleTheme() {

    const isLight =
        document.body.classList.toggle("light-theme");

    localStorage.setItem(
        "messageBurnerTheme",
        isLight ? "light" : "dark"
    );

    updateThemeButton();

}


// Update theme button
function updateThemeButton() {

    const button =
        document.getElementById("themeToggle");

    const isLight =
        document.body.classList.contains("light-theme");

    button.textContent =
        isLight ? "🌙 Dark" : "☀️ Light";

}


// Fetch and display message
async function openMessage() {

    const token =
        window.location.pathname.split("/").pop();

    const box =
        document.getElementById("message");

    try {

        const response = await fetch(
            "/message/" + encodeURIComponent(token)
        );

        const data = await response.json();

        if (!response.ok) {

            throw new Error(
                data.detail || "Message unavailable."
            );

        }

        box.textContent = data.message;

    }

    catch (error) {

        box.textContent = error.message;

        box.classList.add("message-error");

    }

}


// Start reader page
applySavedTheme();

openMessage();

</script>

</body>
</html>
